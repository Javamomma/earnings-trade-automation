name: Earnings Trade Automation

# Runs at the key US market open/close windows. Cron times cover both EST
# (UTC-5) and EDT (UTC-4); the in-job guard enforces the ET window and
# `alpaca_integration.init_alpaca_client().get_clock()` enforces actual
# market-open state, so DST drift is tolerated.
on:
  schedule:
    - cron: '40 13 * * 1-5'   # 09:40 ET during EST
    - cron: '40 14 * * 1-5'   # 09:40 ET during EDT
    - cron: '35 19 * * 1-5'   # 15:35 ET during EST
    - cron: '35 20 * * 1-5'   # 15:35 ET during EDT
  workflow_dispatch:
  push:
    paths:
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/config.yml'
  pull_request:
    paths:
      - '*.py'
      - 'requirements.txt'

# Never let two runs race against the same broker account.
concurrency:
  group: earnings-trade-automation-${{ github.event_name == 'schedule' && 'sched' || github.run_id }}
  cancel-in-progress: false

jobs:
  # Push/PR-time smoke test: a broken dependency pin previously hid for
  # months because import errors only surfaced on in-market-window
  # scheduled runs (out-of-window runs exit at the bash guard before
  # Python starts). This job imports every module on every code push.
  imports:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Import smoke test
        run: |
          python -c "import trade_workflow, automation, alpaca_integration, config, log"
          echo "All modules import cleanly."

  run:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
      GOOGLE_SCRIPT_TOKEN: ${{ secrets.GOOGLE_SCRIPT_TOKEN }}
      ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
      KELLY_FRACTION: ${{ vars.KELLY_FRACTION || '0.06' }}
      KELLY_USE_RAW_EQUITY: ${{ vars.KELLY_USE_RAW_EQUITY || 'false' }}
      MIN_AVG_VOLUME: ${{ vars.MIN_AVG_VOLUME || '1500000' }}
      MIN_IV30_RV30: ${{ vars.MIN_IV30_RV30 || '1.25' }}
      MAX_TS_SLOPE_0_45: ${{ vars.MAX_TS_SLOPE_0_45 || '-0.00406' }}
      MAX_CLOSE_DEBIT_MULTIPLE: ${{ vars.MAX_CLOSE_DEBIT_MULTIPLE || '1.0' }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # Persist trades.db across runs via GitHub Actions cache instead of
      # pushing a binary blob back to git on every invocation.
      - name: Restore trades.db cache
        id: db-cache
        uses: actions/cache/restore@v4
        with:
          path: trades.db
          key: trades-db-${{ github.run_id }}
          restore-keys: |
            trades-db-

      - name: Run workflow
        id: run
        env:
          # `workflow_dispatch` bypasses the time-window guard so you can
          # always trigger a test run manually.
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          current_time=$(TZ="America/New_York" date +'%H:%M')
          echo "Current ET time: $current_time"
          minutes=$((10#$(echo "$current_time" | cut -d: -f1)*60 + 10#$(echo "$current_time" | cut -d: -f2)))
          # Allow 09:35-10:15 ET and 15:30-16:15 ET windows.
          if [ -z "$FORCE" ] && ! (( (minutes >= 575 && minutes <= 615) || (minutes >= 930 && minutes <= 975) )); then
            echo "Outside valid ET trading window; skipping run."
            exit 0
          fi
          python trade_workflow.py

      - name: Save trades.db cache
        # Cache save is best-effort — a cache-server blip must not fail
        # the run after the strategy script succeeded.
        if: always() && hashFiles('trades.db') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: trades.db
          key: trades-db-${{ github.run_id }}

      - name: Upload trades.db as artifact
        if: always() && hashFiles('trades.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trades-db-${{ github.run_id }}
          path: trades.db
          if-no-files-found: ignore
          retention-days: 30
