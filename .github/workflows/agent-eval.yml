name: Agent Evaluation (headless Fable 5)

# Daily analyst run pre-market, weekly deep review Sunday evening.
# Requires ANTHROPIC_API_KEY in repo secrets; runs are skipped cleanly
# when it's absent so forks don't redline.
on:
  schedule:
    - cron: '45 12 * * 1-5'   # ~08:45 ET daily analyst brief
    - cron: '0 1 * * 1'       # Sun 9pm ET (Mon 01:00 UTC) weekly review
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily or weekly'
        default: 'daily'

concurrency:
  group: agent-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-fable-5' }}
    defaults:
      run:
        working-directory: trading-agent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Skip when unconfigured
        id: gate
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set; skipping evaluation."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.configured == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: trading-agent/requirements.txt

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.gate.outputs.configured == 'true'
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Restore journal cache
        if: steps.gate.outputs.configured == 'true'
        uses: actions/cache/restore@v4
        with:
          path: trading-agent/data/journal.db
          key: journal-db-${{ github.run_id }}
          restore-keys: |
            journal-db-

      - name: Decide mode
        if: steps.gate.outputs.configured == 'true'
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            # Weekly on the Monday-01:00-UTC firing, daily otherwise.
            if [ "$(date -u +%u%H)" = "101" ]; then MODE=weekly; else MODE=daily; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run pipeline + headless evaluation
        if: steps.gate.outputs.configured == 'true'
        run: |
          chmod +x bin/*.sh
          bin/${{ steps.mode.outputs.mode }}.sh

      - name: Save journal cache
        if: always() && steps.gate.outputs.configured == 'true' && hashFiles('trading-agent/data/journal.db') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: trading-agent/data/journal.db
          key: journal-db-${{ github.run_id }}

      - name: Upload reports
        if: always() && steps.gate.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: trading-agent/reports/
          if-no-files-found: ignore
          retention-days: 90
